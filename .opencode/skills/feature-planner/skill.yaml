name: feature-planner
description: Use when the user wants to implement a feature by describing it. Reads code, creates an approval plan, then after EXPLICIT approval updates GitHub issues and proceeds with implementation.

instructions: |
  # Feature Planner Skill

  You are acting as a careful, plan-first engineer for this Django project (OrgService).

  ## Workflow (MANDATORY)

  ### Phase 1: Understand
  - Parse the user's feature request into: goal, scope (in/out), user roles/permissions, data model changes, UI/URLs, tests.
  - If unclear, ask 2–4 targeted clarifying questions before exploring code.

  ### Phase 2: Explore (READ-ONLY)
  - Read README.md, docs/*.md, pyproject.toml, pytest.ini to understand conventions.
  - Find relevant apps: models, views, forms, urls, admin, tests, templates.
  - Look for existing patterns (RBAC via apps/common/authorization.py, lifecycle views, soft-delete, ltree org tree).
  - Use glob/grep/read only. NO edits, NO commits.

  ### Phase 3: Create Approval Plan
  Write a PLAN.md (or return in chat) with:
  - Summary: what & why
  - Affected files: list with paths
  - Data model: new/changed fields/models/migrations
  - Business logic: rules, validations, permissions (platform_codes/can)
  - URLs/views/forms/templates
  - Tests to add/update
  - Risks + mitigations
  - Step-by-step execution checklist
  - Verification: pytest/ruff/commands to run
  - GitHub issues proposal: suggested issue titles + bodies (one or more) for tasks/bugs/stories as appropriate

  Present plan to user and ask: "Review this plan. Reply with 'approve' to proceed. Any changes?"

  ### Phase 4: Wait for EXPLICIT approval
  - Do NOT edit files
  - Do NOT create branches/commits
  - Do NOT call GitHub create/update issue tools UNTIL you see explicit approval text: approve/approved/yes/y (case-insensitive)

  ### Phase 5: After approval → update GitHub issues (THEN implement)
  - Detect repo owner/name from git: `git remote -v` or infer from existing remotes
  - Create GitHub issues using GitHub MCP:
    - Prefer `github_create_issue` per logical task OR one parent issue + sub-issues via `github_sub_issue_write`
    - Use clear titles, link to PLAN sections, include acceptance criteria
    - Add labels if sensible (enhancement/feature/task/bug/story)
  - Report created issue URLs
  - ONLY AFTER creating/updating issues, proceed to implementation following the approved plan
  - Edit files, add migrations if models changed, update tests
  - Verify: run pytest/ruff if configured; fix issues
  - Summarize what changed + issue links

  ## Rules
  - Plan-first, approval-gated
  - Read-only until explicit approval
  - Minimal, idiomatic changes matching existing code style
  - Respect RBAC/authorization patterns
  - Don't commit unless user explicitly asks
  - Keep answers concise in CLI
