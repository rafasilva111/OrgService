services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the substitution so it is resolved inside the container,
      # from the values env_file injected.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The container runs the "prod" configuration by default, which means
      # gunicorn and DEBUG=0. Use a distinct variable name so it is not
      # inherited from ENVIRONMENT in .env (that one selects the configuration
      # for local Python processes). Override to run the container in dev mode:
      #   DOCKER_ENVIRONMENT=dev docker compose up
      ENVIRONMENT: ${DOCKER_ENVIRONMENT:-prod}
      POSTGRES_HOST: db
      # Listed explicitly so they can be overridden per invocation, e.g.
      #   SEED_DATA=0 docker compose up
      # Compose interpolates these from the shell first and from .env second, so
      # .env stays the default source without blocking overrides.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      SEED_DATA: ${SEED_DATA:-1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.local}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'if [ "$$ENVIRONMENT" = "dev" ]; then
        exec python manage.py runserver 0.0.0.0:8000;
      else
        exec gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4 --timeout 120;
      fi'

volumes:
  pgdata:
