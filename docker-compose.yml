services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orgplatform}
      POSTGRES_USER: ${POSTGRES_USER:-orgplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgplatform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orgplatform} -d ${POSTGRES_DB:-orgplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: web
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-orgplatform}
      POSTGRES_USER: ${POSTGRES_USER:-orgplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgplatform}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      SEED_DATA: ${SEED_DATA:-1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.local}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'if [ "${DJANGO_DEBUG:-1}" = "0" ]; then
        exec gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4 --timeout 120;
      else
        exec python manage.py runserver 0.0.0.0:8000;
      fi'

volumes:
  pgdata: