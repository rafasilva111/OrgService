name: Bug
description: Report a reproducible bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: "What is broken?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue
      placeholder: "1. Go to...\n2. Click...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "Expected..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Actual..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / Logs / Traceback
      description: Paste stack traces, logs, or screenshots
      placeholder: "Paste traceback here"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Context for reproduction
      placeholder: "Python 3.12 / Django 5.2 / PostgreSQL 16, OS (Linux), browser, URL, commit SHA..."
    validations:
      required: true
  - type: input
    id: affected
    attributes:
      label: Affected area
      description: App, view, URL, or model (e.g. apps/people/views.py, /people/)
      placeholder: "apps/changes/views.py"
  - type: textarea
    id: possible_fix
    attributes:
      label: Possible Fix / Notes
      description: Ideas, workaround, or related code references (file:line)
      placeholder: "suggested fix, or refs..."
