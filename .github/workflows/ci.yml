name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  # Reused by deploy-dev.yml, which runs this whole CI before deploying `dev`
  # (so pushes to `dev` are not tested twice).
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: pip-audit
        run: uv run pip-audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orgplatform
          POSTGRES_USER: orgplatform
          POSTGRES_PASSWORD: orgplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orgplatform -d orgplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: orgplatform
      POSTGRES_USER: orgplatform
      POSTGRES_PASSWORD: orgplatform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
