{% load i18n ui %}
<div class="relative overflow-hidden rounded-xl border border-zinc-200 bg-white p-5 shadow-sm">
  {% if url %}
  <a href="{{ url }}" class="after:absolute after:inset-0" aria-label="{{ label }}"></a>
  <div class="flex items-center justify-between">
    <p class="text-sm font-medium text-zinc-500 group-hover:text-zinc-700">{{ label }}</p>
    <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-600">
      {% icon icon class_name="size-5" %}
    </span>
  </div>
  <p class="mt-3 text-3xl font-bold tracking-tight text-zinc-900">{{ value }}</p>
  {% if hint %}<p class="mt-1 text-xs text-zinc-500">{{ hint }}</p>{% endif %}
  {% else %}
  <div class="flex items-center justify-between">
    <p class="text-sm font-medium text-zinc-500">{{ label }}</p>
    <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-600">
      {% icon icon class_name="size-5" %}
    </span>
  </div>
  <p class="mt-3 text-3xl font-bold tracking-tight text-zinc-900">{{ value }}</p>
  {% if hint %}<p class="mt-1 text-xs text-zinc-500">{{ hint }}</p>{% endif %}
  {% endif %}
</div>
