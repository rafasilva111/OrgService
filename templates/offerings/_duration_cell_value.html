{% load i18n ui %}{% if record.step_pk and duration is not None %}<a href="?step={{ record.step_pk }}&person={{ record.pk }}&order={{ order }}#person-tasks-panel" hx-get="?step={{ record.step_pk }}&person={{ record.pk }}&order={{ order }}" hx-target="#person-tasks-panel" hx-swap="innerHTML" data-panel-key="{{ record.pk }}-{{ order }}" hx-on:htmx:before-request="const panel = document.getElementById('person-tasks-panel'); if (panel.firstElementChild && panel.firstElementChild.dataset.panelKey === this.dataset.panelKey) { event.preventDefault(); panel.innerHTML = ''; }" class="underline decoration-zinc-300 decoration-dotted underline-offset-4 transition hover:decoration-zinc-500" title="{% translate 'Show the longest tasks' %}">{% endif %}{% if plain %}{{ duration|format_duration }}{% else %}{% include "offerings/_sla_duration.html" with sla=record.sla_minutes %}{% endif %}{% if record.step_pk and duration is not None %}</a>{% endif %}
